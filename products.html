<!doctype html>

<html lang="en-GB">

<head>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Products | Everything Wool</title>

<meta
name="description"
content="Browse the handmade wool products available from Everything Wool."

>

    <link rel="stylesheet" href="styles.css">
<style>
  
    /* =========================================
       PRODUCTS PAGE
       ========================================= */

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 40px;
    }

    .search {
      width: 280px;
      max-width: 100%;
      padding: 13px 16px;

      border: 1px solid #d8cbbd;
      border-radius: 10px;

      background: #fffaf4;
      color: #40352d;

      font-family: inherit;
      font-size: 1rem;
    }

    .search:focus {
      outline: none;
      border-color: #8b6b52;
      box-shadow: 0 0 0 3px rgba(139, 107, 82, 0.12);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product-card {
      padding: 20px;

      background: #fffaf4;

      border: 1px solid #ded2c4;
      border-radius: 16px;

      box-shadow: 0 8px 25px rgba(90, 65, 45, 0.06);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(90, 65, 45, 0.1);
    }

    .product-card h2 {
      margin: 18px 0 8px;

      color: #654936;
      font-size: 1.4rem;
    }

    .product-card p {
      color: #756456;
    }

    .product-image {
      display: block;

      width: 100%;
      height: 220px;

      object-fit: cover;

      border-radius: 10px;
    }

    .price {
      margin-top: 15px;

      color: #76553f !important;

      font-size: 1.25rem;
      font-weight: bold;
    }

    .stock-status {
      display: inline-block;

      margin-top: 8px;
      padding: 4px 10px;

      border-radius: 999px;

      font-size: 0.85rem;
      font-weight: 600;
    }

    .in-stock {
      background: #e6f5e9;
      color: #28643a;
    }

    .low-stock {
      background: #fff1c2;
      color: #795900;
    }

    .out-of-stock {
      background: #fbe4e4;
      color: #8b2222;
    }

    .no-products {
      padding: 40px;

      background: #fffaf4;

      border: 1px solid #ded2c4;
      border-radius: 16px;

      text-align: center;
      color: #756456;
    }


    /* ---------- Mobile ---------- */

    @media (max-width: 850px) {

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .page-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

    }


    @media (max-width: 550px) {

      .product-grid {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 240px;
      }

    }
</style>
</head>

<body>

  <!-- Header -->

  <header class="site-header">


<a class="brand" href="index.html">

  <img
    src="assets/logo.jpeg"
    alt="Everything Wool logo"
  >

  <span>Everything Wool</span>

</a>


<nav aria-label="Main navigation">

  <a href="index.html">
    Home
  </a>

  <a
    class="active"
    href="products.html"
  >
    Products
  </a>

  <a href="about.html">
    About us
  </a>

  <a href="contact.html">
    Contact
  </a>

</nav>


  </header>

  <!-- Products -->

  <main class="section">


<div class="page-heading">

  <div>

    <p class="eyebrow">
      SHOP
    </p>

    <h1>
      Our products
    </h1>
  <p>You can not buy products form this website but if you would like to buy products please shop here.</p>
    <a class="button" href="https://everything-wool.co/">Shop products</a>
  </div>


  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search products…"
    aria-label="Search products"
  >

</div>


<div
  id="products"
  class="product-grid"
  aria-live="polite"
></div>


  </main>

  <!-- Footer -->

  <footer>
    © <span id="year"></span> Everything Wool
  </footer>

  <script>

    /* -----------------------------------------
       Footer year
       ----------------------------------------- */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* -----------------------------------------
       Product data
       ----------------------------------------- */

    let allProducts = [];


    /* -----------------------------------------
       Escape HTML
       ----------------------------------------- */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* -----------------------------------------
       Format price
       ----------------------------------------- */

    function formatPrice(value) {

      const price = Number(value);

      if (Number.isNaN(price)) {
        return "Price unavailable";
      }

      return new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP"
      }).format(price);

    }


    /* -----------------------------------------
       Stock status
       ----------------------------------------- */

    function getStockStatus(stock) {

      if (stock <= 0) {

        return `
          <span class="stock-status out-of-stock">
            Out of stock
          </span>
        `;

      }


      if (stock < 4) {

        return `
          <span class="stock-status low-stock">
            Low on stock
          </span>
        `;

      }


      return `
        <span class="stock-status in-stock">
          In stock
        </span>
      `;

    }


    /* -----------------------------------------
       Render products
       ----------------------------------------- */

    function renderProducts(search = "") {

      const container =
        document.getElementById("products");

      const query =
        search.trim().toLowerCase();


      const filtered =
        allProducts.filter(product => {

          const name =
            String(
              product["Product Name"] || ""
            ).toLowerCase();

          const description =
            String(
              product["Description"] || ""
            ).toLowerCase();

          return (
            name.includes(query) ||
            description.includes(query)
          );

        });


      if (!filtered.length) {

        container.innerHTML = `
          <div class="no-products">
            <p>
              No products found.
            </p>
          </div>
        `;

        return;

      }


      container.innerHTML =
        filtered.map(product => {

          const stock =
            Number(product["Stock"]) || 0;


          const name =
            escapeHTML(
              product["Product Name"]
            );


          const description =
            product["Description"]
              ? `
                <p>
                  ${escapeHTML(
                    product["Description"]
                  )}
                </p>
              `
              : "";


          const image =
            product["Image URL"];


          const imageHTML =
            image
              ? `
                <img
                  class="product-image"
                  src="${escapeHTML(image)}"
                  alt="${name}"
                  loading="lazy"
                >
              `
              : "";


          return `

            <article class="product-card">

              ${imageHTML}

              <h2>
                ${name}
              </h2>

              ${description}

              <p class="price">
                ${formatPrice(
                  product["Price"]
                )}
              </p>

              ${getStockStatus(stock)}

            </article>

          `;

        }).join("");

    }


    /* -----------------------------------------
       Load products.json
       ----------------------------------------- */

    fetch("./products.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Could not load products.json"
          );

        }

        return response.json();

      })

      .then(products => {

        if (!Array.isArray(products)) {

          throw new Error(
            "products.json does not contain a product list"
          );

        }

        allProducts = products;

        renderProducts();

      })

      .catch(error => {

        console.error(
          "Products error:",
          error
        );

        document.getElementById("products").innerHTML = `

          <div class="no-products">

            <p>
              Sorry, we couldn't load the products right now.
            </p>

            <p>
              Please try again later.
            </p>

          </div>

        `;

      });


    /* -----------------------------------------
       Search
       ----------------------------------------- */

    document
      .getElementById("search")
      .addEventListener("input", event => {

        renderProducts(
          event.target.value
        );

      });

  </script>

</body>
</html>
