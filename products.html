<!doctype html>

<html lang="en-GB">

<head>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Products | Everything Wool</title>

<meta
name="description"
content="Browse the handmade wool products available from Everything Wool."

>

  <link rel="stylesheet" href="products.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- Header -->

  <header class="site-header">


<a class="brand" href="index.html">

  <img
    src="assets/logo.jpeg"
    alt="Everything Wool logo"
  >

  <span>Everything Wool</span>

</a>


<nav aria-label="Main navigation">

  <a href="index.html">
    Home
  </a>

  <a
    class="active"
    href="products.html"
  >
    Products
  </a>

  <a href="about.html">
    About us
  </a>

  <a href="contact.html">
    Contact
  </a>

</nav>


  </header>

  <!-- Products -->

  <main class="section">


<div class="page-heading">

  <div>

    <p class="eyebrow">
      SHOP
    </p>

    <h1>
      Our products
    </h1>

  </div>


  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search products…"
    aria-label="Search products"
  >

</div>


<div
  id="products"
  class="product-grid"
  aria-live="polite"
></div>


  </main>

  <!-- Footer -->

  <footer>
    © <span id="year"></span> Everything Wool
  </footer>

  <script>

    /* -----------------------------------------
       Footer year
       ----------------------------------------- */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* -----------------------------------------
       Product data
       ----------------------------------------- */

    let allProducts = [];


    /* -----------------------------------------
       Escape HTML
       ----------------------------------------- */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* -----------------------------------------
       Format price
       ----------------------------------------- */

    function formatPrice(value) {

      const price = Number(value);

      if (Number.isNaN(price)) {
        return "Price unavailable";
      }

      return new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP"
      }).format(price);

    }


    /* -----------------------------------------
       Stock status
       ----------------------------------------- */

    function getStockStatus(stock) {

      if (stock <= 0) {

        return `
          <span class="stock-status out-of-stock">
            Out of stock
          </span>
        `;

      }


      if (stock < 4) {

        return `
          <span class="stock-status low-stock">
            Low on stock
          </span>
        `;

      }


      return `
        <span class="stock-status in-stock">
          In stock
        </span>
      `;

    }


    /* -----------------------------------------
       Render products
       ----------------------------------------- */

    function renderProducts(search = "") {

      const container =
        document.getElementById("products");

      const query =
        search.trim().toLowerCase();


      const filtered =
        allProducts.filter(product => {

          const name =
            String(
              product["Product Name"] || ""
            ).toLowerCase();

          const description =
            String(
              product["Description"] || ""
            ).toLowerCase();

          return (
            name.includes(query) ||
            description.includes(query)
          );

        });


      if (!filtered.length) {

        container.innerHTML = `
          <div class="no-products">
            <p>
              No products found.
            </p>
          </div>
        `;

        return;

      }


      container.innerHTML =
        filtered.map(product => {

          const stock =
            Number(product["Stock"]) || 0;


          const name =
            escapeHTML(
              product["Product Name"]
            );


          const description =
            product["Description"]
              ? `
                <p>
                  ${escapeHTML(
                    product["Description"]
                  )}
                </p>
              `
              : "";


          const image =
            product["Image URL"];


          const imageHTML =
            image
              ? `
                <img
                  class="product-image"
                  src="${escapeHTML(image)}"
                  alt="${name}"
                  loading="lazy"
                >
              `
              : "";


          return `

            <article class="product-card">

              ${imageHTML}

              <h2>
                ${name}
              </h2>

              ${description}

              <p class="price">
                ${formatPrice(
                  product["Price"]
                )}
              </p>

              ${getStockStatus(stock)}

            </article>

          `;

        }).join("");

    }


    /* -----------------------------------------
       Load products.json
       ----------------------------------------- */

    fetch("./products.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Could not load products.json"
          );

        }

        return response.json();

      })

      .then(products => {

        if (!Array.isArray(products)) {

          throw new Error(
            "products.json does not contain a product list"
          );

        }

        allProducts = products;

        renderProducts();

      })

      .catch(error => {

        console.error(
          "Products error:",
          error
        );

        document.getElementById("products").innerHTML = `

          <div class="no-products">

            <p>
              Sorry, we couldn't load the products right now.
            </p>

            <p>
              Please try again later.
            </p>

          </div>

        `;

      });


    /* -----------------------------------------
       Search
       ----------------------------------------- */

    document
      .getElementById("search")
      .addEventListener("input", event => {

        renderProducts(
          event.target.value
        );

      });

  </script>

</body>
</html>
